# Minimal SearXNG configuration for the AI Playground.
# Full reference: https://docs.searxng.org/admin/settings/settings.html
use_default_settings: true

general:
  instance_name: "AI Playground search"

server:
  # Overridden by the SEARXNG_SECRET environment variable (scripts/run-searxng.sh or docker-compose.yml).
  secret_key: "replace-me"
  limiter: false
  image_proxy: false

search:
  safe_search: 1
  # The backend uses the JSON API, which must be enabled explicitly.
  formats:
    - html
    - json
