[project]
name = "ai-playground-backend"
version = "0.1.0"
description = "Open-Source AI Playground: local RAG, web search, SQL and agentic AI backend"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "qdrant-client>=1.12",
  "pymupdf>=1.24",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "langgraph>=0.2.60",
  "sqlglot>=25.0",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
]

[project.optional-dependencies]
# Local embedding + reranking models. Kept optional so the core API and the unit
# tests install quickly; the Docker image and the README setup install it.
embeddings = ["sentence-transformers>=3.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
  "integration: requires locally running Ollama / SearXNG / embedding model (set RUN_INTEGRATION=1)",
]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
